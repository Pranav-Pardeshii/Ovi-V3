<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="OVI Cashout Interdiction Platform">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1F2433"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity="0"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="18" fill="#0B0D13"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="997" height="297" rx="17" fill="none" stroke="#8B7CF6" stroke-opacity=".38" stroke-width="1.5"/>

  <!-- ============ title block ============ -->
  <text x="48" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#EEF1F8" letter-spacing="2">OVI</text>
  <text x="50" y="142" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="600" fill="#A6AFC6" letter-spacing="4">CASHOUT INTERDICTION PLATFORM</text>
  <text x="50" y="172" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6E7994" letter-spacing="1">traces the thread backwards · forecasts where it goes next</text>
  <rect x="50" y="188" width="300" height="2" fill="url(#fade)"/>

  <!-- ============ confidence tier chips (staggered glow) ============ -->
  <g font-family="Consolas, Menlo, monospace" font-size="11" font-weight="600">
    <g>
      <rect x="560" y="46" width="118" height="24" rx="12" fill="#F87171" fill-opacity=".09" stroke="#F87171" stroke-opacity=".55"/>
      <circle cx="574" cy="58" r="3.5" fill="#F87171"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="584" y="62" fill="#F87171">T1 · EXACT ATM</text>
    </g>
    <g>
      <rect x="690" y="46" width="140" height="24" rx="12" fill="#FB923C" fill-opacity=".09" stroke="#FB923C" stroke-opacity=".55"/>
      <circle cx="704" cy="58" r="3.5" fill="#FB923C"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" begin=".4s" repeatCount="indefinite"/></circle>
      <text x="714" y="62" fill="#FB923C">T2 · DISTRICT ZONE</text>
    </g>
    <g>
      <rect x="842" y="46" width="112" height="24" rx="12" fill="#FBBF24" fill-opacity=".09" stroke="#FBBF24" stroke-opacity=".55"/>
      <circle cx="856" cy="58" r="3.5" fill="#FBBF24"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
      <text x="866" y="62" fill="#FBBF24">T3 · RAIL MIX</text>
    </g>
    <g>
      <rect x="712" y="80" width="130" height="24" rx="12" fill="#818DA8" fill-opacity=".09" stroke="#818DA8" stroke-opacity=".55"/>
      <circle cx="726" cy="92" r="3.5" fill="#818DA8"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="736" y="96" fill="#818DA8">T4 · WATCHLIST</text>
    </g>
  </g>

  <!-- ============ money trail ============ -->
  <!-- trunk edges (tokenised hops) -->
  <g stroke="#A6AFC6" stroke-opacity=".45" stroke-width="1.6" stroke-dasharray="5 7">
    <path d="M 84 236 H 208"/>
    <path d="M 232 236 H 356"/>
    <path d="M 376 236 L 486 196"/>
    <path d="M 376 236 H 486"/>
    <path d="M 376 236 L 486 276"/>
  </g>
  <!-- animated flow on trunk -->
  <path d="M 84 236 H 486" fill="none" stroke="#8B7CF6" stroke-width="1.8" stroke-dasharray="4 22" stroke-opacity=".9">
    <animate attributeName="stroke-dashoffset" from="0" to="-156" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- forecast edge: mule -> ATM, dashed red, flowing -->
  <path d="M 502 196 L 618 182" fill="none" stroke="#F87171" stroke-width="1.8" stroke-dasharray="5 6" stroke-opacity=".85">
    <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- travelling pulses along the trail -->
  <circle r="3.5" fill="#AC9FF9">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 84 236 L 486 236"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#AC9FF9">
    <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M 84 236 L 486 236"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#F87171">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 502 196 L 622 181"/>
  </circle>

  <!-- victim node -->
  <circle cx="76" cy="236" r="8" fill="#12141C" stroke="#8B7CF6" stroke-width="2"/>
  <circle cx="76" cy="236" r="8" fill="none" stroke="#8B7CF6" stroke-width="1.2" opacity=".8">
    <animate attributeName="r" values="8;15" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="76" y="262" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" fill="#8B7CF6" letter-spacing="1.5">VICTIM</text>

  <!-- hop nodes -->
  <g fill="#12141C" stroke-width="2">
    <circle cx="220" cy="236" r="6.5" stroke="#7FB0F2"/>
    <circle cx="366" cy="236" r="6.5" stroke="#7FD4A8"/>
  </g>
  <text x="220" y="258" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#6E7994">TKN-A629</text>
  <text x="366" y="258" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#6E7994">TKN-8026</text>

  <!-- mule nodes with P(mule) arcs -->
  <g fill="#12141C" stroke-width="2">
    <circle cx="496" cy="196" r="7" stroke="#F08E93"/>
    <circle cx="496" cy="236" r="7" stroke="#E4C37B"/>
    <circle cx="496" cy="276" r="7" stroke="#B49CF0"/>
  </g>
  <path d="M 496 187 A 9 9 0 0 1 505 196" fill="none" stroke="#F87171" stroke-width="2.4"/>
  <text x="484" y="184" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="9" fill="#A6AFC6">P(mule) 0.94</text>
  <text x="514" y="240" font-family="Consolas, Menlo, monospace" font-size="9" fill="#A6AFC6">P(mule) 0.88</text>
  <text x="514" y="280" font-family="Consolas, Menlo, monospace" font-size="9" fill="#6E7994">P(mule) 0.61</text>

  <!-- ATM forecast node + pulse rings -->
  <g>
    <rect x="622" y="174" width="18" height="18" rx="3" fill="#12141C" stroke="#F87171" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="631" cy="183" r="12" fill="none" stroke="#F87171" stroke-width="1.4">
      <animate attributeName="r" values="12;30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="631" cy="183" r="12" fill="none" stroke="#F87171" stroke-width="1.4">
      <animate attributeName="r" values="12;30" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="631" y="166" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#F87171" letter-spacing="1.5">FORECAST</text>
    <text x="631" y="210" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9" fill="#6E7994">ATM-SBI-BLR-0873 · T1 window</text>
  </g>

  <!-- interdiction clock -->
  <g font-family="Consolas, Menlo, monospace">
    <rect x="716" y="168" width="238" height="64" rx="10" fill="#11141C" stroke="#303851"/>
    <text x="732" y="192" font-size="9" fill="#6E7994" letter-spacing="2">INTERDICTION CLOCK · P50</text>
    <text x="732" y="219" font-size="26" font-weight="700" fill="#F87171">01:47:5<tspan>0</tspan>
      <animate attributeName="fill" values="#F87171;#FB923C;#F87171" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- footer strip -->
  <g font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#6E7994" letter-spacing="1.5">
    <text x="48" y="286">I4C · NCRP / CFCFRMS</text>
    <text x="240" y="286">FEDERATED · DPDP §17 · HASH-ANCHORED</text>
    <text x="856" y="286" text-anchor="end" fill="#8B7CF6">TEAM RYZENUP · SIH 2026</text>
  </g>
</svg>
